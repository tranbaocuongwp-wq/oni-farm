# KHÔNG chạy tự động. Deploy tự động do Cloudflare Pages Git integration lo
# (mỗi push lên main, Cloudflare tự clone + build + deploy — xem docs/DEPLOY.md).
# Giữ workflow này làm đường lui, chạy tay ở tab Actions → Run workflow, phòng khi
# Git integration hỏng. Cần 2 secret: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
name: Deploy Cloudflare Pages (chạy tay)

on:
  workflow_dispatch:

concurrency:
  group: pages-deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Kiểm thử (typecheck + sim + OTA)
        run: npm run test:all

      - name: Build
        run: npm run build

      - name: Deploy lên Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=oni-farm --branch=main --commit-dirty=true
