<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover: cho phép vẽ tràn ra vùng tai thỏ, rồi CSS dùng
         env(safe-area-inset-*) để đẩy nút bấm ra khỏi đó. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#14100c" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OniFarm" />
    <meta name="description" content="OniFarm — game nông trại hiện đại pixel art, chơi offline hoàn toàn." />
    <title>OniFarm — Chơi</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
  </head>
  <body>
    <div id="app">
      <!-- #stage là KHUNG CHỨA mà camera đo. Canvas phủ kín nó; khung nhìn được
           căn giữa bên trong bằng offset letterbox do camera tính. -->
      <div id="stage">
        <canvas id="game" aria-label="Nông trại"></canvas>

        <!-- HUD và modal là DOM, không vẽ lên canvas: chữ sắc nét ở mọi cỡ màn
             hình và mọi mật độ điểm ảnh, không phụ thuộc hệ số phóng của game. -->
        <div id="hud"></div>
        <div id="devpanel" hidden></div>
        <div id="buildmode" hidden></div>

        <!-- Thanh báo bản mới. KHÔNG tự tải lại: người chơi đang giữa một ngày
             trong game mà trang tự làm mới thì mất phần chưa lưu. -->
        <div id="update-bar" hidden role="status">
          <span class="txt">Có bản mới</span>
          <button type="button" class="go">Tải lại</button>
          <button type="button" class="x" aria-label="Để sau">×</button>
        </div>
        <div id="modal-root"></div>
        <div id="tutorial" hidden></div>

        <!-- Điều khiển cảm ứng. Chỉ hiện khi thiết bị có cảm ứng; chuột và bàn
             phím vẫn chạy song song. Bố cục lật theo body[data-hand]. -->
        <div id="touch">
          <div id="stick">
            <div class="base"><div class="knob"></div></div>
          </div>

          <div id="abtn">
            <button type="button" id="linebtn" class="linebtn" aria-pressed="false" hidden>TUYẾN</button>
            <div class="why" hidden></div>
            <div class="btns">
              <button type="button" class="auto" aria-label="Tự động làm" aria-pressed="false">AUTO</button>
              <button type="button" class="b" aria-label="Tương tác">E</button>
              <button type="button" class="a" aria-label="Dùng vật phẩm">DÙNG</button>
            </div>
          </div>

          <div id="sysbtn">
            <button type="button" class="menu" aria-label="Menu">
              <span></span><span></span><span></span>
            </button>
          </div>
        </div>
      </div>

      <div id="boot">
        <div class="inner">
          <div class="sprout" aria-hidden="true"><i></i><i></i><i></i></div>
          <div class="logo">ONI<span>FARM</span></div>
          <p>Đang dựng nông trại…</p>
        </div>
      </div>
    </div>

    <script type="module" src="../main.ts"></script>
  </body>
</html>
